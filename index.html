<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="Description"
        content="Open Substation Communication Designer is a bottom-up system configuration tool for projects described using IEC 61850-6 Edition 2 or greater.">
  <base href="/open-scd/">

  <!-- Original URL from Google: https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@300&family=Roboto:wght@300;400;500&display=swap -->
  <!-- Original URL from Google: https://fonts.googleapis.com/css?family=Material+Icons+Outlined&display=block -->
  <link rel="manifest"
        href="/open-scd/assets/manifest-ClMyZhmZ.json">
  <link rel="icon"
        type="image/png"
        sizes="16x16"
        href="/open-scd/assets/favicon-16x16-Ce0DZXCu.png">
  <link rel="icon"
        type="image/png"
        sizes="32x32"
        href="/open-scd/assets/favicon-32x32-35b18mbJ.png">
  <link rel="icon"
        type="image/png"
        sizes="192x192"
        href="/open-scd/assets/icon-192x192-CAEUmphd.png">

  <title>OpenSCD</title>
  <script type="module" crossorigin src="/open-scd/assets/index-BfiX6T6C.js"></script>
  <link rel="stylesheet" crossorigin href="/open-scd/assets/index-cYZAcpbL.css">
</head>

<body>
  <open-scd id="oscd"></open-scd>
  
  <script type="module">
  const oscd = document.querySelector('#oscd');

  oscd.plugins = {
    menu: [],
    editor: [
      {
        name: 'Demo-Plugin',
        src: 'https://ase-compas.github.io/open-scd/demo/hello-world-plugin.js',
        kind: 'editor',
        requireDoc: true,
        position: 'middle',
        active: true,
        activeByDefault: false,
        config: { name: 'BuiltIn-Plugin' },
      },
    ],
  };
  </script>

  <script src="/open-scd/scoped-custom-elements-polyfill.js"></script>

  <script>
    const _customElementsDefine = window.customElements.define;
    window.customElements.define = (name, cl, conf) => {
      if (!customElements.get(name)) {
        _customElementsDefine.call(window.customElements, name, cl, conf);
      }
    };
  </script>
  <script>
    if ('serviceWorker' in navigator)
      navigator.serviceWorker.register('/open-scd/sw.js', { scope: '/open-scd/' });
  </script>
  <script>
    const openScd = document.querySelector("open-scd");
    addEventListener("beforeunload", e => {
      if (openScd && openScd.doc) {
        e.preventDefault();
        return e.returnValue = "Are you sure you want to exit?";
      }
    });
  </script>
</body>

</html>
